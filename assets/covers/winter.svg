<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="winter-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="45%" stop-color="#3d5a80"/>
      <stop offset="100%" stop-color="#8ab4d4"/>
    </linearGradient>
    <linearGradient id="winter-aurora" x1="0" y1="0" x2="1" y2="1">
